name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  secrets-scan:
    name: 🔒 Gitleaks - Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: 🔍 Semgrep - Static Analysis
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"

  docker-build-trivy:
    name: 🐳 Docker Build & 🛡️ Trivy Scan
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-api-image:${{ github.sha }} .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-api-image:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker tag my-api-image:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/api-agendamento:${{ github.sha }}
          docker tag my-api-image:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/api-agendamento:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api-agendamento:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api-agendamento:latest

  iac-scan:
    name: 🏗️ Terraform IaC Scan (Trivy)
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Run Trivy configuration scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  dast-scan:
    name: 🌐 OWASP ZAP - Dynamic Analysis
    runs-on: ubuntu-latest
    needs: [docker-build-trivy]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Start Application for DAST
        run: |
          docker run -d -p 3000:3000 my-api-image:${{ github.sha }}
          sleep 10 # Wait for app to start
        
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          fail_action: false # Não bloquear a pipeline em avisos pequenos, mas logar as vulnerabilidades
