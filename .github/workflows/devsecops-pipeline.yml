name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  secrets-scan:
    name: 🔒 Gitleaks - Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: 🔍 Semgrep - Static Analysis
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"

  docker-build-trivy:
    name: 🐳 Docker Build & 🛡️ Trivy Scan
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-api-image:${{ github.sha }} .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-api-image:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker tag my-api-image:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/api-agendamento:${{ github.sha }}
          docker tag my-api-image:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/api-agendamento:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api-agendamento:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api-agendamento:latest

  iac-scan:
    name: 🏗️ Terraform IaC Scan (Trivy)
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Run Trivy configuration scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  dast-scan:
    name: 🌐 OWASP ZAP - Dynamic Analysis
    runs-on: ubuntu-latest
    needs: [docker-build-trivy]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Docker Network
        run: docker network create dast-net

      - name: Start PostgreSQL
        run: |
          docker run -d --name dast-db --network dast-net \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=agendamento \
            postgres:15-alpine

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker exec dast-db pg_isready -U postgres -d agendamento > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Build Docker Image for DAST
        run: docker build -t my-api-image:${{ github.sha }} .

      - name: Start Application for DAST
        run: |
          docker run -d --name dast-app --network dast-net -p 3000:3000 \
            -e PORT=3000 \
            -e DB_HOST=dast-db \
            -e DB_PORT=5432 \
            -e DB_USERNAME=postgres \
            -e DB_PASSWORD=postgres \
            -e DB_NAME=agendamento \
            my-api-image:${{ github.sha }}
          sleep 10

      - name: Verify Application is Running
        run: |
          docker logs dast-app
          curl -f http://localhost:3000 || echo "App may not have a root endpoint, continuing..."
        
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
